# Set your personal hyprland configuration here
# See https://wiki.hyprland.org/Configuring for more information

# // █ █▄░█ █▀█ █░█ ▀█▀
# // █ █░▀█ █▀▀ █▄█ ░█░


#  Uncomment to enable // change to a preferred value
# 🔗 See https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = de
    kb_variant = qwerty
    follow_mouse = 1
    mouse_refocus = false
    # sensitivity = 0
    # force_no_accel = 0
    # accel_profile = flat 
    # numlock_by_default = true

    # 🔗 See https://wiki.hyprland.org/Configuring/Variables/#touchpad
    touchpad {
        natural_scroll = no
    }

}



# 🔗 See https://wiki .hyprland.org/Configuring/Variables/#gestures
gestures {
#     workspace_swipe = true
#     workspace_swipe_fingers = 3
}

# for window shallow similar to devour
misc {
    # enable_swallow = true
    # swallow_regex = (foot|kitty|allacritty|Alacritty|ghostty|Ghostty|org.wezfurlong.wezterm)
}

# Don't show update on first launch
ecosystem {
  # no_update_news = true
}

# Hide config error bar
debug {
    suppress_errors = true
}



# Lid: lock the screen instead of suspending, so downloads/builds keep running.
# The inhibitor stops logind's lid-suspend for this session only (ends on logout).
exec-once = systemd-inhibit --what=handle-lid-switch --who=Hyprland --why="Lid locks instead of suspending" --mode=block sleep infinity
bindl = , switch:on:Lid Switch, exec, loginctl lock-session

# Privacy report window (opened from the waybar privacy dot)
windowrule = float true, center true, size 1000 720, match:class ^(privacy-report)$

# Privacy blur overlays (see ~/.local/bin/privacy-blur): Hyprland blurs whatever is under them
layerrule = blur true, match:namespace privacy-blur
layerrule = ignore_alpha 0, match:namespace privacy-blur

# Regenerate Bread wallpapers to fit newly plugged-in monitors (see ~/.local/bin/bread-wallgen)
exec-once = bread-wallgen-watch

# Switch off external screens stuck at 0x0 so waybar/wallpaper keep working (see ~/.local/bin/ghost-monitor-guard)
exec-once = ghost-monitor-guard

# Home wallpaper after login and after locks of an hour+ (see ~/.local/bin/bread-home)
exec-once = bread-home watch

# Re-apply custom fixes after HyDE updates + daily backup (see ~/.local/bin/hyde-keep)
exec-once = hyde-keep login
