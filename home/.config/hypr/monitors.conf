# Set your monitor configuration here
# See https://wiki.hyprland.org/Configuring/Monitors/
# For a sample file, please refer to https://github.com/prasanthrangan/hyprdots/blob/main/Configs/.config/hypr/monitors.t2

# Layout: two Dell E2220H side by side on top, laptop centred underneath.
#   [ Dell GF7V813 ][ Dell DF7V813 ]
#           [  laptop eDP-1  ]
# Matched by serial (desc:) so it survives dock port renumbering (DP-8/DP-9...).
# To swap the two Dells, exchange their x positions (0 <-> 1920).
monitor = desc:Dell Inc. DELL E2220H GF7V813, 1920x1080@60, 0x0, 1
monitor = desc:Dell Inc. DELL E2220H DF7V813, 1920x1080@60, 1920x0, 1
monitor = eDP-1, 1920x1080@60, 960x1080, 1
# any other screen: native resolution, placed automatically
monitor = , preferred, auto, 1
